name: Windows installer

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: prototype/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            build-requirements.txt

      - name: Install frontend dependencies
        run: npm.cmd --prefix prototype ci

      - name: Test and build frontend
        run: |
          npm.cmd --prefix prototype run test:bridge
          npm.cmd --prefix prototype run build
          npm.cmd --prefix prototype run test:sites

      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt -r build-requirements.txt

      - name: Run Python tests
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Build Windows packages
        run: python scripts/package_windows.py

      - name: Write SHA256 checksum
        shell: pwsh
        run: |
          $installer = Get-ChildItem -LiteralPath "dist/installer" -Filter "QYReader-Setup-*.exe" | Select-Object -First 1
          if (-not $installer) { throw "Installer was not generated" }
          $hash = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash
          "$hash *$($installer.Name)" | Set-Content -LiteralPath "dist/installer/SHA256SUMS.txt" -Encoding ascii

      - name: Upload Windows installer
        uses: actions/upload-artifact@v7
        with:
          name: QYReader-Windows-${{ github.sha }}
          path: |
            dist/installer/QYReader-Setup-*.exe
            dist/installer/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
